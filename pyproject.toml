[project]
name = "mcp-server"
version = "0.4.0"
description = "Graphiti MCP Server"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "mcp>=1.24.0",
    "graphiti-core>=0.24.3,<1.0",
    "aiohttp>=3.13.2",
    "uvicorn>=0.38.0",
    "psutil>=7.1.3",
    "groq>=1.1.1",
]

[project.optional-dependencies]
# 本地 cross-encoder 重排（BAAI/bge-reranker-v2-m3，中文重排品質佳、無 API 成本）
# 安裝：uv sync --extra reranker（首次使用會下載約 1GB 模型）
reranker = ["sentence-transformers>=3.0.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
